name: build

# Compiles every kernel (CUDA + SYCL) inside the Fedora 44 image from
# ci/Dockerfile, then runs the SYCL binaries on the runner's CPU with full
# verification. GitHub-hosted runners have no GPU, so CUDA is build-only.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The image (CUDA toolkit + DPC++ toolchain) is several GB; the default
      # runner disk is tight, so drop preinstalled SDKs this job never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v3

      # Layers are cached in the Actions cache keyed on the Dockerfile, so
      # the image is only rebuilt when ci/Dockerfile changes.
      - name: Build CI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ci/Dockerfile
          tags: cuda-sycl-kernels-ci:latest
          load: true
          cache-from: type=gha,scope=ci-image
          cache-to: type=gha,scope=ci-image,mode=max

      - name: Build kernels and verify SYCL on CPU
        run: docker run --rm -v "$PWD":/src cuda-sycl-kernels-ci:latest ci/build.sh
